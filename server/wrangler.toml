name = "watch-together-relay"
main = "src/index.js"
compatibility_date = "2025-11-01"

# The relay is reachable only at relay.watch-together.net. Turning these off
# removes the workers.dev route and the per-version preview hostnames, which
# would otherwise stay publicly served alongside the custom domain.
workers_dev = false
preview_urls = false

# Pins the custom domain in config instead of leaving it as dashboard-only
# state, so a deploy from CI provisions the hostname itself. Idempotent —
# wrangler reuses the existing relay.watch-together.net domain.
[[routes]]
pattern = "relay.watch-together.net"
custom_domain = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Caps how fast one address can open sockets, before any Durable Object is
# created or billed. Deliberately approximate — the counter is per Cloudflare
# location and eventually consistent — because this is an abuse valve against
# room farming, not an accounting system. Period must be 10 or 60.
[[ratelimits]]
name = "CONNECTS"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# new_sqlite_classes (not new_classes) is required for Durable Objects on the
# Workers Free plan. Switching an already-deployed class between the two
# storage backends is not possible, so leave this as-is.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
