<!DOCTYPE html>
<html>

<head>
  <title>WatchTogether</title>
  <link rel="stylesheet" href="../static/bootstrap.min.css">
  <link rel="stylesheet" href="../static/mdb.lite.min.css">
  <link rel="stylesheet" href="../static/popup.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
</head>

<body>

  <div id="start" class="text-center">
    <h6>Create a session or join one:</h6>
    <button id="newSessionBtn" class="btn btn-danger">Create</button>
    <span class="infoText">or</span>
    <button id="joinSessionBtn" class="btn btn-outline-danger">Join</button>
  </div>

  <div id="session">
    <h6 class="offset-2">Room code &mdash; share it with your friend:</h6>
    <div class="input-group">
      <input type="text" id="roomCode" class="form-control roomCode" placeholder="&hellip;" readonly />
      <div class="input-group-append">
        <button id="copyBtn" class="btn btn-md btn-outline-dark m-0 px-3">Copy</button>
      </div>
    </div>
    <div id="status" class="infoText statusLine" role="status">Connecting&hellip;</div>
  </div>

  <div id="join">
    <h6 class="offset-2">Enter your friend's room code:</h6>
    <div class="input-group">
      <input type="text" id="joinCode" class="form-control roomCode" placeholder="ABC-DEF-GHI" autocomplete="off" />
      <div class="input-group-append">
        <button id="connectBtn" class="btn btn-md btn-danger m-0 px-3">Connect</button>
      </div>
    </div>
    <div id="joinHint" class="infoText statusLine" role="status"></div>
  </div>

  <div id="footer" class="text-center">
    <button id="backBtn" class="btn btn-link infoText">Leave session</button>
    <div id="syncToggle" class="sync-toggle-group">
      <button class="sync-btn" data-sync="none">Off</button>
      <button class="sync-btn" data-sync="page">This Page</button>
      <button class="sync-btn" data-sync="all">All</button>
    </div>
  </div>

  <div id="settings">
    <button id="settingsBtn" class="btn btn-link infoText settingsToggle">Relay server</button>
    <div id="settingsPanel" hidden>
      <div class="input-group">
        <input type="text" id="relayUrl" class="form-control" placeholder="wss://&hellip;" autocomplete="off" />
        <div class="input-group-append">
          <button id="saveRelayBtn" class="btn btn-md btn-outline-dark m-0 px-3">Save</button>
        </div>
      </div>
      <div id="relayHint" class="infoText settingsHint">Leave empty to use the built-in relay.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
